name: build-containers

on:
  push:
    branches: ['main']
    tags:
      - 'v*'
  pull_request:
    branches: ['main']

jobs:
  api:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write

    outputs:
      docker_image: ${{ steps.prepare.outputs.docker_image }}
      version: ${{ steps.prepare.outputs.version }}

    env:
      REGISTRY: ghcr.io
      IMAGE_OWNER: dvgamerr-app
      IMAGE_FILE: Dockerfile
      IMAGE_NAME: aide-collector
      PLATFORMS: linux/arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare 🔰
        id: prepare
        run: |
          echo "docker_image=${{env.REGISTRY}}/${{env.IMAGE_OWNER}}/${{ env.IMAGE_NAME }}" >> $GITHUB_OUTPUT

          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
          [ "$VERSION" == "main" ] && VERSION=latest
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          echo "buildx_args=--platform $PLATFORMS \
            --build-arg VERSION=${VERSION} \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            --tag ${{env.REGISTRY}}/${{env.IMAGE_OWNER}}/$IMAGE_NAME:$VERSION --file $IMAGE_FILE ." >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx 📐
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }} 🔍
        if: success() && !contains(github.event_name, 'pull_request')
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.IMAGE_OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Push 📌
        run: docker buildx build --output "type=image,push=${{ !contains(github.event_name, 'pull_request') }}" ${{ steps.prepare.outputs.buildx_args }}

  deploy:
    runs-on: self-hosted
    needs: [api]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      packages: read
    env:
      CONTAINER_NAME: aide-collector
      IMAGE_OWNER: dvgamerr-app

    steps:
      - name: Create GitHub Release 🎉
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## What's Changed

            🐳 **Docker Image:**
            - `${{ needs.api.outputs.docker_image }}:${{ needs.api.outputs.version }}`

            Built from commit: ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull new image
        env:
          ONT_PASS: ${{ secrets.ONT_PASS }}
        run: |
          test -n "$ONT_PASS" || { echo 'ONT_PASS secret is required'; exit 1; }
          container image pull ${{ needs.api.outputs.docker_image }}:${{ needs.api.outputs.version }}
          container stop ${{ env.CONTAINER_NAME }} || true
          container delete ${{ env.CONTAINER_NAME }} || true

      - name: Start new container
        env:
          ONT_PASS: ${{ secrets.ONT_PASS }}
          AG_PASS: ${{ secrets.AG_PASS }}
          ONT_ID: ${{ vars.ONT_ID || 'main' }}
          ONT_BASE: ${{ vars.ONT_BASE || 'http://10.203.1.1' }}
          ONT_USER: ${{ vars.ONT_USER || 'admin' }}
          ONT_MIN_INTERVAL: ${{ vars.ONT_MIN_INTERVAL || '60' }}
          ONT_REQUEST_TIMEOUT: ${{ vars.ONT_REQUEST_TIMEOUT || '15' }}
          AG_BASE: ${{ vars.AG_BASE || 'http://10.203.1.91:8080' }}
          AG_USER: ${{ vars.AG_USER || 'dvgamerr' }}
          AG_CLIENT_INTERVAL: ${{ vars.AG_CLIENT_INTERVAL || '900' }}
          NOTIFY_API_KEY: ${{ secrets.NOTIFY_API_KEY }}
          NOTIFY_CINEMA_CHAT: ${{ secrets.NOTIFY_CINEMA_CHAT }}
          TRACEWAY_URL: ${{ vars.TRACEWAY_URL || 'http://traceway.local' }}
          TRACEWAY_TOKEN: ${{ secrets.TRACEWAY_TOKEN }}
          DATABASE_WAKATIME_URL: ${{ secrets.DATABASE_WAKATIME_URL }}
          GH_USER_TOKEN: ${{ secrets.GH_USER_TOKEN }}
          GH_APP_TOKEN: ${{ secrets.GH_APP_TOKEN }}
          GH_OURKK_TOKEN: ${{ secrets.GH_OURKK_TOKEN }}
          GH_WORK_TOKEN: ${{ secrets.GH_WORK_TOKEN }}
          GH_AUTHOR_EMAIL: ${{ vars.GH_AUTHOR_EMAIL }}
        run: |
          container rm -f ${{ env.CONTAINER_NAME }} 2>/dev/null || true
          container run -d \
            --name ${{ env.CONTAINER_NAME }} \
            --cpus 1 --memory 512M \
            -e DATABASE_URL=${{ secrets.DATABASE_URL }} \
            -e MEA_PAYLOAD=${{ secrets.MEA_PAYLOAD }} \
            -e MWA_PAYLOAD=${{ secrets.MWA_PAYLOAD }} \
            -e SOLAR_DEVICE_ID=${{ vars.SOLAR_DEVICE_ID }} \
            -e SOLAR_OPEN_APP_ID=${{ vars.SOLAR_OPEN_APP_ID }} \
            -e SOLAR_OPEN_APP_SECRET=${{ secrets.SOLAR_OPEN_APP_SECRET }} \
            -e SOLAR_PAYLOAD=${{ secrets.SOLAR_PAYLOAD }} \
            -e ONT_PASS -e AG_PASS \
            -e ONT_ID -e ONT_BASE -e ONT_USER \
            -e ONT_MIN_INTERVAL -e ONT_REQUEST_TIMEOUT \
            -e AG_BASE -e AG_USER -e AG_CLIENT_INTERVAL \
            -e NOTIFY_API_KEY -e NOTIFY_CINEMA_CHAT \
            -e TRACEWAY_TOKEN -e TRACEWAY_URL \
            -e DATABASE_WAKATIME_URL \
            -e GH_USER_TOKEN -e GH_APP_TOKEN -e GH_OURKK_TOKEN -e GH_WORK_TOKEN \
            -e GH_AUTHOR_EMAIL \
            -p 3001:3000 \
            ${{ needs.api.outputs.docker_image }}:${{ needs.api.outputs.version }}

      # แจ้ง Discord หลัง rollout สำเร็จ — sender `kube <ชื่อแอป>` · แจ้งไม่ได้ต้องไม่ทำให้ deploy ที่สำเร็จแล้วล้ม
      - name: Notify Discord (rolled out)
        if: success()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NOTIFY_APP: ${{ env.CONTAINER_NAME }}
          NOTIFY_IMAGE: ${{ needs.api.outputs.docker_image }}:${{ needs.api.outputs.version }}
        run: |
          test -n "$DISCORD_WEBHOOK" || { echo '::warning::DISCORD_WEBHOOK is empty, skip alert'; exit 0; }
          payload=$(printf '{"username":"kube %s","content":"<:ok:1042489844619804682> Rolled out `%s`","allowed_mentions":{"parse":[]}}' "$NOTIFY_APP" "$NOTIFY_IMAGE")
          curl --silent --show-error --max-time 15 -H 'Content-Type: application/json' \
            -d "$payload" "$DISCORD_WEBHOOK"

  # build หรือ deploy ล้มก็แจ้ง — deploy ถูกข้ามเมื่อ build ล้ม จึงต้องแยกเป็น job ของมันเอง
  notify-failure:
    runs-on: ubuntu-24.04-arm
    needs: [api, deploy]
    if: ${{ always() && github.event_name != 'pull_request' && (needs.api.result == 'failure' || needs.deploy.result == 'failure') }}
    permissions: {}

    steps:
      - name: Notify Discord (failed)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BUILD_RESULT: ${{ needs.api.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test -n "$DISCORD_WEBHOOK" || { echo '::warning::DISCORD_WEBHOOK is empty, cannot notify'; exit 0; }
          stage=deploy
          if [ "$BUILD_RESULT" = failure ]; then stage=build; fi
          payload=$(printf '{"username":"kube aide-collector","content":"<:fai:1065521737896300604><:led:1065521734096257024> %s failed — <%s>","allowed_mentions":{"parse":[]}}' "$stage" "$RUN_URL")
          curl --silent --show-error --max-time 15 -H 'Content-Type: application/json' \
            -d "$payload" "$DISCORD_WEBHOOK" || true
